      <path fill="#78009d" d="m154.92 15.25c10.39-3.94 23 1.47 27.35 11.69a21.93 21.93 0 0 1-24.47 30.5 21.89 21.89 0 0 1-17.23-18.72c-1.51-9.93 4.87-20.25 14.35-23.47z"/>
      <path fill="#78009d" d="M9.68,72.57c5.78-2.08,11.42-6.76,17.89-4.93a13.54,13.54,0,0,1,9,8.16c9.28,18.66,18.48,37.36,27.8,56,9.33-19.07,18.93-38,28.26-57.07,2.48-5.41,9-8.76,14.79-7.13,3.48,1,6.65,2.88,10,4.25s7,2.7,9,5.83A12.28,12.28,0,0,1,127,91c-14.72,26.3-29.57,52.52-44.3,78.8A16,16,0,0,1,75.15,177c-4.61,2-9.75.93-14.62,1.23a15.06,15.06,0,0,1-14-7.59q-21.45-38-42.86-76.11C1.74,91.22-.39,87.68.06,83.68.28,78.25,4.81,74.2,9.68,72.57Z"/>
      <path fill="#78009d" d="m209.65 70.74c4.74-2.27 10.19-5.1 15.44-2.54 6.09 2.28 7.87 9 10.62 14.23 8.33 16.36 16.13 33 24.62 49.26q14-28.47 28.2-56.89c2.43-5.5 9.06-8.88 14.91-7.17 3.43 1.07 6.57 2.86 9.88 4.22 3.06 1.4 6.53 2.47 8.64 5.28a12.43 12.43 0 0 1 0.91 14q-22.31 39.62-44.62 79.24a15 15 0 0 1-13.67 7.87c-5.51-0.32-11.53 1.07-16.53-1.94-3.13-1.58-5.16-4.54-6.76-7.54q-21.67-38.67-43.45-77.27a12.39 12.39 0 0 1 0-13.31c2.52-4.28 7.68-5.33 11.81-7.44z"/>
      <path fill="#78009d" d="m375.12 68.58c11.45-2 23.61-0.83 34.14 4.27a55.58 55.58 0 1 1-34.14-4.27zm7.49 33.19a22 22 0 0 0-16 11 21.88 21.88 0 0 0 20 32.62c11.58-0.12 21.72-11 20.83-22.61 0.12-12.56-12.53-23.18-24.83-21.01z"/>
      <path fill="#78009d" d="M153.89,69.07c4.87-.37,9.76-.08,14.64-.17,7.23-.23,13.23,6.59,13.08,13.64.15,26.7,0,53.4.07,80.11.21,5-1.63,10.33-6,13.19-5,3.63-11.46,2-17.19,2.38a13.93,13.93,0,0,1-13.7-7c-2-3.49-1.67-7.63-1.68-11.5q0-38.49,0-77A13.64,13.64,0,0,1,153.89,69.07Z"/>
    </g>
    <!-- linha inferior sutil na tela -->
    <rect x="80" y="960" width="420" height="26" rx="13" fill="#7b2fd0" opacity="0.25"/>
    <rect x="80" y="998" width="300" height="12" rx="6" fill="#7b2fd0" opacity="0.12"/>
  </g>

  <!-- vigneta p/ legibilidade da UI -->
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#050308" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
