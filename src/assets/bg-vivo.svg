<?xml version="1.0" encoding="UTF-8"?>
<!-- Fundo do app: cena inspirada na foto de referência (celular com o logo Vivo sobre
     um palco roxo "Contrale"). Recreacao vetorial 100% embutida — sem fotografia, sem
     internet: o logo usa a arte oficial src/assets/logo-vivo.svg (Wikimedia, paths PUROS)
     redesenhado dentro da cena. Escala perfeita em qualquer tela (SVG). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070310"/>
      <stop offset="0.55" stop-color="#160a2b"/>
      <stop offset="1" stop-color="#0b0518"/>
    </linearGradient>
    <radialGradient id="palco" cx="0.78" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8b2fc9" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5f1a94" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2a0f4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="palco2" cx="0.25" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#4b1a79" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4b1a79" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tela" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbfbfe"/>
      <stop offset="0.6" stop-color="#eef0f6"/>
      <stop offset="1" stop-color="#dfe3ec"/>
    </linearGradient>
  </defs>

  <!-- base escura + palco roxo -->
  <rect width="1920" height="1080" fill="url(#bgBase)"/>
  <rect width="1920" height="1080" fill="url(#palco)"/>
  <rect width="1920" height="1080" fill="url(#palco2)"/>

  <!-- faixa "browser" no topo (pagina roxa, nitida) -->
  <g opacity="0.85">
    <rect x="1100" y="-40" width="900" height="300" rx="60" fill="#7b2fd0" opacity="0.45"/>
    <rect x="330" y="60" width="980" height="180" rx="40" fill="#6c24b8" opacity="0.5"/>
    <circle cx="1560" cy="330" r="110" fill="#b57ef5" opacity="0.32"/>
  </g>

  <!-- texto fantasma "Contrale" -->
  <g transform="translate(1360 240) rotate(-4)">
    <text x="0" y="70" font-family="'Segoe UI','Inter',sans-serif" font-size="92" font-weight="700" fill="#ecd9ff" opacity="0.24">✱ Contrale</text>
    <text x="8" y="180" font-family="'Segoe UI','Inter',sans-serif" font-size="58" font-weight="600" fill="#d8bff2" opacity="0.16">Mapa de fibra — Vivo</text>
  </g>

  <!-- fileira de miniature embaixo a direita (nitida) -->
  <g opacity="0.6">
    <rect x="1290" y="700" width="150" height="86" rx="12" fill="#3b2a55"/>
    <rect x="1462" y="700" width="150" height="86" rx="12" fill="#52406e"/>
    <rect x="1634" y="700" width="150" height="86" rx="12" fill="#442f61"/>
    <rect x="1806" y="700" width="120" height="86" rx="12" fill="#574170"/>
    <rect x="1290" y="820" width="640" height="14" rx="7" fill="#c9a6f2" opacity="0.5"/>
  </g>

  <!-- neon: caminhos de fibra ondulados (nitidos) -->
  <g fill="none" stroke-linecap="round">
    <path d="M1120 640 C 1240 560, 1330 660, 1420 590 S 1620 470, 1760 520 S 1900 560, 1980 470" stroke="#d7a9ff" stroke-width="9" opacity="0.5"/>
    <path d="M1140 240 C 1280 180, 1380 300, 1530 240 S 1780 170, 1900 260" stroke="#9a5cf0" stroke-width="11" opacity="0.42"/>
    <path d="M1180 760 C 1300 700, 1420 790, 1540 720 S 1740 660, 1880 720" stroke="#efdcff" stroke-width="5" opacity="0.5"/>
  </g>

  <!-- celular inclinado, tela clara com o logo Vivo -->
  <g transform="rotate(-17 300 900)">
    <!-- corpo/aro escuro -->
    <rect x="-90" y="240" width="1560" height="820" rx="70" fill="#0a0714"/>
    <rect x="-62" y="268" width="1504" height="764" rx="52" fill="url(#tela)"/>
    <!-- logo oficial dentro da tela -->
    <g transform="translate(255 560) scale(1.55)">
